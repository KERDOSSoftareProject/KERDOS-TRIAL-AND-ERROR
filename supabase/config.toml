# The recovery-sweep endpoint has its own shared-secret check before any DB
# access. Scheduled callers do not have a Supabase user JWT.
[functions.recovery-sweep]
verify_jwt = false

# process-attachment retains the gateway JWT check and additionally requires
# the exact service-role bearer value in its handler.
[functions.process-attachment]
verify_jwt = true

# Postmark sends an HTTP Basic credential, not a Supabase JWT. The handler
# verifies that credential before reading or writing any email data.
[functions.inbound-email]
verify_jwt = false

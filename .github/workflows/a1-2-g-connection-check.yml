name: A1.2.g Test Database Connection Check

# Manual only; this workflow never runs the price-save/recovery race tests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "psycopg2-binary==2.9.9"
      - name: Check two read-only database sessions
        env:
          KERDOS_TEST_DATABASE_URL: ${{ secrets.KERDOS_TEST_DATABASE_URL }}
        run: python scripts/check_a1_2_g_connection.py

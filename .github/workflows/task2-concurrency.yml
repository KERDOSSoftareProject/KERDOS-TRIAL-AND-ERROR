name: Task 2 PostgreSQL Concurrency

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  independent-sessions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify B4 field identification and uncoded listing identity
        run: npm run test:b4 && node src/core/vendor-listing-test.mjs
      - name: Verify product grouping and pricing confirmation
        run: |
          node --test scripts/test_task_b_product_grouping.mjs scripts/test_task_b_description_fallback.mjs
          node src/backend/catalog-row-sql-test.mjs
      - name: Verify catalog label lookup, preservation, and concurrent numbering
        env:
          KERDOS_CONCURRENCY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          node scripts/test_task_b_product_label_sql.mjs
          node scripts/test_task_b_product_label_sql.mjs --concurrent
      - name: Verify separate-session draft, order, receipt and payment races
        env:
          KERDOS_CONCURRENCY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run test:task2-concurrency
